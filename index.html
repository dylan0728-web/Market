
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  color:#fff;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:linear-gradient(135deg,#101820,#202d38);
}
header{
  height:76px;padding:20px 30px;
  display:flex;align-items:center;justify-content:space-between;
  background:#111b24;border-bottom:1px solid #40505d;
}
header h2{margin:0;font-size:25px}
#status{color:#aebdca;font-size:14px}
main{padding:25px}
#message{color:#ffcf70;margin-bottom:20px}
#apps{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.app{
  min-height:105px;padding:18px;
  display:flex;align-items:center;gap:14px;
  background:#293945;border:2px solid #405461;
  border-radius:12px;cursor:pointer;
}
.app:focus,.app.selected{
  outline:none;border-color:#fff;
  background:#3b5363;transform:scale(1.02);
}
.appIcon{
  width:54px;height:54px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:#526b7b;font-size:25px;flex-shrink:0;
}
.appName{font-size:17px;font-weight:bold;word-break:break-word}
.appInfo{font-size:13px;color:#b8c6cf;margin-top:8px}
button{
  color:white;background:#334b5a;border:1px solid #718796;
  padding:9px 16px;border-radius:8px;cursor:pointer;
}
@media(max-width:700px){
  #apps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:450px){
  #apps{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h2>Market</h2>
  <div>
    <button onclick="loadApps()">重新整理</button>
    <span id="status">APK 市場</span>
  </div>
</header>
<main>
  <div id="message">正在讀取 APK 清單...</div>
  <div id="apps"></div>
</main>
<script>
var appsElement=document.getElementById("apps");
var messageElement=document.getElementById("message");
var statusElement=document.getElementById("status");

function formatSize(bytes){
  if(!bytes)return "大小未知";
  return (bytes/1024/1024).toFixed(1)+" MB";
}

function loadApps(){
  appsElement.innerHTML="";
  messageElement.textContent="正在讀取 APK 清單...";
  statusElement.textContent="讀取中";

  fetch("https://api.github.com/repos/dylan0728-web/Market/releases")
  .then(function(response){
    if(!response.ok)throw new Error("GitHub API "+response.status);
    return response.json();
  })
  .then(function(releases){
    var count=0;
    releases.forEach(function(release){
      (release.assets||[]).forEach(function(asset){
        if(!asset.name.toLowerCase().endsWith(".apk"))return;
        count++;

        var card=document.createElement("div");
        card.className="app";
        card.tabIndex=0;

        var icon=document.createElement("div");
        icon.className="appIcon";
        icon.textContent="APK";

        var info=document.createElement("div");
        var name=document.createElement("div");
        name.className="appName";
        name.textContent=asset.name;

        var detail=document.createElement("div");
        detail.className="appInfo";
        detail.textContent="版本："+release.tag_name+" · "+formatSize(asset.size);

        info.appendChild(name);
        info.appendChild(detail);
        card.appendChild(icon);
        card.appendChild(info);

        card.addEventListener("click",function(){
          if(window.AndroidMarket &&
             typeof window.AndroidMarket.startDownload==="function"){
            window.AndroidMarket.startDownload(asset.browser_download_url,asset.name);
          }else{
            window.open(asset.browser_download_url,"_blank");
          }
        });

        appsElement.appendChild(card);
      });
    });

    if(count===0){
      messageElement.textContent="目前沒有 APK，請先在 GitHub Releases 上傳 APK 檔案。";
    }else{
      messageElement.textContent="找到 "+count+" 個 APK";
    }
    statusElement.textContent="讀取完成";
  })
  .catch(function(error){
    messageElement.textContent="讀取失敗："+error.message;
    statusElement.textContent="讀取失敗";
  });
}

document.addEventListener("keydown",function(event){
  var cards=Array.prototype.slice.call(
    document.querySelectorAll(".app")
  );
  if(!cards.length)return;

  var current=cards.indexOf(document.activeElement);
  if(current<0)current=0;

  var next=current;
  if(event.key==="ArrowRight")next=Math.min(current+1,cards.length-1);
  else if(event.key==="ArrowLeft")next=Math.max(current-1,0);
  else if(event.key==="ArrowDown")next=Math.min(current+3,cards.length-1);
  else if(event.key==="ArrowUp")next=Math.max(current-3,0);
  else return;

  event.preventDefault();
  cards[next].focus();
});

loadApps();
</script>
</body>
</html>
