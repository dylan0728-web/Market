
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  color:#fff;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:linear-gradient(135deg,#101820,#202d38);
}

header{
  min-height:76px;
  padding:18px 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#111b24;
  border-bottom:1px solid #40505d;
}

header h2{
  margin:0;
  font-size:25px;
}

#status{
  color:#aebdca;
  font-size:14px;
  margin-left:12px;
}

main{padding:25px}

#message{
  color:#ffcf70;
  margin-bottom:20px;
}

#apps{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}

.app{
  min-height:112px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:14px;
  background:#293945;
  border:2px solid #405461;
  border-radius:12px;
  cursor:pointer;
  transition:background .15s,transform .15s;
}

.app:focus,.app.selected{
  outline:none;
  border-color:#fff;
  background:#3b5363;
  transform:scale(1.02);
}

.iconColumn{
  width:66px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.appIcon{
  width:54px;
  height:54px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#526b7b;
  font-size:20px;
  font-weight:bold;
}

.appIcon img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.progressArea{
  width:66px;
  margin-top:7px;
  display:none;
  flex-direction:column;
  align-items:center;
}

.progressTrack{
  width:100%;
  height:5px;
  overflow:hidden;
  border-radius:5px;
  background:#17232c;
}

.progressFill{
  width:0%;
  height:100%;
  border-radius:5px;
  background:#36d58a;
  transition:width .2s;
}

.progressText{
  margin-top:4px;
  color:#8de9b9;
  font-size:11px;
  white-space:nowrap;
}

.appInfo{
  min-width:0;
  flex:1;
}

.appName{
  font-size:17px;
  font-weight:bold;
  word-break:break-word;
}

.appDetail{
  font-size:13px;
  color:#b8c6cf;
  margin-top:8px;
  word-break:break-word;
}

button{
  color:white;
  background:#334b5a;
  border:1px solid #718796;
  padding:9px 16px;
  border-radius:8px;
  cursor:pointer;
}

@media(max-width:700px){
  #apps{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:450px){
  #apps{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h2>Market</h2>
  <div>
    <button onclick="loadApps()">重新整理</button>
    <span id="status">APK 市場</span>
  </div>
</header>

<main>
  <div id="message">正在讀取 APK 清單...</div>
  <div id="apps"></div>
</main>

<script>
var appsElement=document.getElementById("apps");
var messageElement=document.getElementById("message");
var statusElement=document.getElementById("status");

var appCards={};
var appNames={};

function formatSize(bytes){
  if(!bytes)return "大小未知";
  return (bytes/1024/1024).toFixed(1)+" MB";
}

function loadNameMap(){
  return fetch("./apps.json?time="+Date.now())
    .then(function(response){
      if(!response.ok)throw new Error("apps.json 尚未建立");
      return response.json();
    })
    .then(function(data){
      appNames={};
      (data.apps||[]).forEach(function(item){
        if(item.file && item.name){
          appNames[item.file]=item.name;
        }
      });
    })
    .catch(function(){
      appNames={};
    });
}

function createCard(asset,release){
  var fileName=asset.name;
  var downloadUrl=asset.browser_download_url;

  var card=document.createElement("div");
  card.className="app";
  card.tabIndex=0;

  var iconColumn=document.createElement("div");
  iconColumn.className="iconColumn";

  var icon=document.createElement("div");
  icon.className="appIcon";
  icon.textContent="APK";

  var progressArea=document.createElement("div");
  progressArea.className="progressArea";

  var progressTrack=document.createElement("div");
  progressTrack.className="progressTrack";

  var progressFill=document.createElement("div");
  progressFill.className="progressFill";

  var progressText=document.createElement("div");
  progressText.className="progressText";
  progressText.textContent="0%";

  progressTrack.appendChild(progressFill);
  progressArea.appendChild(progressTrack);
  progressArea.appendChild(progressText);

  iconColumn.appendChild(icon);
  iconColumn.appendChild(progressArea);

  var info=document.createElement("div");
  info.className="appInfo";

  var name=document.createElement("div");
  name.className="appName";
  name.textContent=appNames[fileName] || fileName.replace(/\.apk$/i,"");

  var detail=document.createElement("div");
  detail.className="appDetail";
  detail.textContent="版本："+(release.tag_name||"最新版本")+" · "+formatSize(asset.size);

  info.appendChild(name);
  info.appendChild(detail);

  card.appendChild(iconColumn);
  card.appendChild(info);

  appCards[downloadUrl]={
    card:card,
    icon:icon,
    detail:detail,
    progressArea:progressArea,
    progressFill:progressFill,
    progressText:progressText
  };

  card.addEventListener("click",function(){
    if(window.AndroidMarket &&
       typeof window.AndroidMarket.checkApp==="function"){

      window.AndroidMarket.checkApp(downloadUrl,fileName);

    }else if(window.AndroidMarket &&
             typeof window.AndroidMarket.startDownload==="function"){

      window.AndroidMarket.startDownload(downloadUrl,fileName);

    }else{
      window.open(downloadUrl,"_blank");
    }
  });

  return card;
}

function loadApps(){
  appsElement.innerHTML="";
  appCards={};

  messageElement.textContent="正在讀取 APK 清單...";
  statusElement.textContent="讀取中";

  loadNameMap().then(function(){

    return fetch("https://api.github.com/repos/dylan0728-web/Market/releases");

  }).then(function(response){
    if(!response.ok)throw new Error("GitHub API "+response.status);
    return response.json();

  }).then(function(releases){

    var count=0;

    releases.forEach(function(release){
      (release.assets||[]).forEach(function(asset){

        if(!asset.name.toLowerCase().endsWith(".apk"))return;

        count++;
        appsElement.appendChild(createCard(asset,release));

      });
    });

    if(count===0){
      messageElement.textContent="目前沒有 APK，請先在 GitHub Releases 上傳 APK 檔案。";
    }else{
      messageElement.textContent="找到 "+count+" 個 APK";
    }

    statusElement.textContent="讀取完成";

  }).catch(function(error){
    messageElement.textContent="讀取失敗："+error.message;
    statusElement.textContent="讀取失敗";
  });
}

/* Android 回傳單一 APK 的下載進度 */
window.onApkDownloadProgress=function(url,percent,state){

  var app=appCards[url];
  if(!app)return;

  var value=Math.max(0,Math.min(100,Number(percent)||0));

  app.progressArea.style.display="flex";
  app.progressFill.style.width=value+"%";
  app.progressText.textContent=value+"%";

  if(state==="complete" || value>=100){
    app.progressText.textContent="下載完成";
    app.detail.textContent="下載完成，準備安裝";
  }else if(state==="failed"){
    app.progressText.textContent="下載失敗";
    app.detail.textContent="下載失敗，請重新點擊";
  }else{
    app.progressText.textContent="下載中… "+value+"%";
    app.detail.textContent="下載中…";
  }
};

/* Android 回傳 APK 或已安裝軟體的圖示 */
window.onApkIconResult=function(url,iconData){
  var app=appCards[url];
  if(!app || !iconData)return;

  var img=document.createElement("img");
  img.src=iconData;
  img.alt="";

  app.icon.innerHTML="";
  app.icon.appendChild(img);
};

/* 電視盒遙控器方向鍵操作 */
document.addEventListener("keydown",function(event){

  var cards=Array.prototype.slice.call(
    document.querySelectorAll(".app")
  );

  if(!cards.length)return;

  var current=cards.indexOf(document.activeElement);
  if(current<0)current=0;

  var next=current;

  if(event.key==="ArrowRight"){
    next=Math.min(current+1,cards.length-1);
  }else if(event.key==="ArrowLeft"){
    next=Math.max(current-1,0);
  }else if(event.key==="ArrowDown"){
    next=Math.min(current+3,cards.length-1);
  }else if(event.key==="ArrowUp"){
    next=Math.max(current-3,0);
  }else{
    return;
  }

  event.preventDefault();
  cards[next].focus();
});

loadApps();
</script>

</body>
</html>
