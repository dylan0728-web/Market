<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  color:#fff;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:linear-gradient(135deg,#101820,#202d38);
}

header{
  min-height:76px;
  padding:15px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#111b24;
  border-bottom:1px solid #40505d;
}

header h2{
  margin:0;
  font-size:25px;
}

#status{
  color:#aebdca;
  font-size:14px;
  margin-left:12px;
}

main{padding:25px}

#message{
  color:#ffcf70;
  margin-bottom:20px;
}

#apps{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}

.app{
  min-height:125px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:14px;
  background:#293945;
  border:2px solid #405461;
  border-radius:12px;
  cursor:pointer;
}

.app:focus,.app.selected{
  outline:none;
  border-color:#fff;
  background:#3b5363;
  transform:scale(1.02);
}

/* 圖示及進度條專用區域 */
.appVisual{
  width:76px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}

.appIcon{
  width:64px;
  height:64px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#526b7b;
  font-size:16px;
  font-weight:bold;
}

/* 每個軟體自己的下載進度 */
.downloadArea{
  width:76px;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.downloadArea.show{
  display:flex;
}

.downloadTrack{
  width:100%;
  height:6px;
  background:#17232c;
  border-radius:10px;
  overflow:hidden;
}

.downloadBar{
  width:0%;
  height:100%;
  background:#36a9ee;
  border-radius:10px;
  transition:width .3s ease;
}

.downloadText{
  width:100%;
  font-size:11px;
  color:#b8dfff;
  text-align:center;
  white-space:nowrap;
}

.appInfo{
  min-width:0;
  flex:1;
}

.appName{
  font-size:17px;
  font-weight:bold;
  word-break:break-word;
}

.appInfoText{
  font-size:13px;
  color:#b8c6cf;
  margin-top:8px;
  word-break:break-word;
}

.appState{
  display:inline-block;
  margin-top:7px;
  padding:4px 9px;
  border-radius:6px;
  background:#526b7b;
  color:#fff;
  font-size:13px;
}

.appState.installed{background:#16784a}
.appState.download{background:#315f9b}
.appState.downloading{background:#176d9e}

button{
  color:white;
  background:#334b5a;
  border:1px solid #718796;
  padding:9px 16px;
  border-radius:8px;
  cursor:pointer;
}

@media(max-width:700px){
  #apps{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:450px){
  #apps{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h2>Market</h2>
  <div>
    <button onclick="loadApps()">重新掃描</button>
    <span id="status">APK 市場</span>
  </div>
</header>

<main>
  <div id="message">正在讀取 APK 清單...</div>
  <div id="apps"></div>
</main>

<script>
var appsElement=document.getElementById("apps");
var messageElement=document.getElementById("message");
var statusElement=document.getElementById("status");

var appCards={};
var scanList=[];

function formatSize(bytes){
  if(!bytes)return "大小未知";
  return (bytes/1024/1024).toFixed(1)+" MB";
}

function loadApps(){

  appsElement.innerHTML="";
  appCards={};
  scanList=[];

  messageElement.textContent="正在讀取 GitHub APK 清單...";
  statusElement.textContent="讀取中";

  fetch("https://api.github.com/repos/dylan0728-web/Market/releases")

  .then(function(response){
    if(!response.ok)throw new Error("GitHub API "+response.status);
    return response.json();
  })

  .then(function(releases){

    var count=0;

    releases.forEach(function(release){

      (release.assets||[]).forEach(function(asset){

        if(!asset.name.toLowerCase().endsWith(".apk"))return;

        count++;

        var card=document.createElement("div");
        card.className="app";
        card.tabIndex=0;

        /* 圖示與下載進度區 */
        var visual=document.createElement("div");
        visual.className="appVisual";

        var icon=document.createElement("div");
        icon.className="appIcon";
        icon.textContent="APK";

        /* 獨立進度條 */
        var downloadArea=document.createElement("div");
        downloadArea.className="downloadArea";

        var track=document.createElement("div");
        track.className="downloadTrack";

        var bar=document.createElement("div");
        bar.className="downloadBar";

        track.appendChild(bar);

        var percentText=document.createElement("div");
        percentText.className="downloadText";
        percentText.textContent="0%";

        downloadArea.appendChild(track);
        downloadArea.appendChild(percentText);

        visual.appendChild(icon);
        visual.appendChild(downloadArea);

        /* 軟體資訊 */
        var info=document.createElement("div");
        info.className="appInfo";

        var name=document.createElement("div");
        name.className="appName";
        name.textContent=asset.name;

        var detail=document.createElement("div");
        detail.className="appInfoText";
        detail.textContent="版本："+release.tag_name+
          " · "+formatSize(asset.size);

        var state=document.createElement("div");
        state.className="appState";
        state.textContent="正在辨識...";

        info.appendChild(name);
        info.appendChild(detail);
        info.appendChild(state);

        card.appendChild(visual);
        card.appendChild(info);

        var app={
          url:asset.browser_download_url,
          name:asset.name,
          packageName:"",
          installed:false,
          bar:bar,
          downloadArea:downloadArea,
          percentText:percentText,
          detail:detail,
          state:state,
          ready:false
        };

        appCards[asset.browser_download_url]=app;

        scanList.push({
          url:asset.browser_download_url,
          name:asset.name
        });

        card.addEventListener("click",function(){

          if(!app.ready){
            messageElement.textContent="正在辨識軟體，請稍候...";
            return;
          }

          if(app.installed && app.packageName){

            if(window.AndroidMarket &&
               typeof window.AndroidMarket.launchApp==="function"){
              window.AndroidMarket.launchApp(app.packageName);
            }

            return;
          }

          if(window.AndroidMarket &&
             typeof window.AndroidMarket.startDownload==="function"){

            window.AndroidMarket.startDownload(app.url,app.name);

          }else{
            window.open(app.url,"_blank");
          }

        });

        appsElement.appendChild(card);

      });

    });

    if(count===0){
      messageElement.textContent="目前沒有 APK，請先在 GitHub Releases 上傳 APK 檔案。";
      statusElement.textContent="沒有 APK";
      return;
    }

    messageElement.textContent="找到 "+count+" 個 APK，正在逐一掃描辨識...";
    statusElement.textContent="掃描中";

    if(window.AndroidMarket &&
       typeof window.AndroidMarket.scanApks==="function"){

      window.AndroidMarket.scanApks(JSON.stringify(scanList));

    }else{

      messageElement.textContent="目前不是 Android 市場環境，無法辨識已安裝狀態。";

      scanList.forEach(function(item){
        var app=appCards[item.url];
        app.ready=true;
        app.state.textContent="下載";
        app.state.className="appState download";
      });

      statusElement.textContent="網頁預覽模式";
    }

  })

  .catch(function(error){
    messageElement.textContent="讀取失敗："+error.message;
    statusElement.textContent="讀取失敗";
  });
}


/* APK 掃描結果 */
window.onApkScanResult=function(url,packageName,installed,appLabel){

  var app=appCards[url];
  if(!app)return;

  app.packageName=packageName||"";
  app.installed=installed===true;
  app.ready=true;

  if(app.installed){

    app.state.textContent="已安裝 · 點擊開啟";
    app.state.className="appState installed";

  }else{

    app.state.textContent="下載";
    app.state.className="appState download";

  }

  app.detail.textContent=appLabel||app.name;

  var finished=0;

  Object.keys(appCards).forEach(function(key){
    if(appCards[key].ready)finished++;
  });

  messageElement.textContent="掃描進度："+finished+"/"+scanList.length;

  if(finished===scanList.length){
    messageElement.textContent="掃描完成，共 "+scanList.length+" 個 APK";
    statusElement.textContent="辨識完成";
  }

};


/* 每個軟體獨立顯示下載進度 */
window.onApkDownloadProgress=function(url,percent,state){

  var app=appCards[url];
  if(!app)return;

  percent=Math.max(0,Math.min(100,Number(percent)||0));

  app.downloadArea.classList.add("show");
  app.bar.style.width=percent+"%";
  app.percentText.textContent=percent+"%";

  if(state==="complete"){

    app.bar.style.width="100%";
    app.percentText.textContent="100%";
    app.percentText.textContent="下載完成";

    app.state.textContent="準備安裝";
    app.state.className="appState installed";
    app.detail.textContent="下載完成，準備安裝";

  }else if(state==="failed"){

    app.downloadArea.classList.remove("show");
    app.bar.style.width="0%";

    app.state.textContent="下載失敗，點擊重試";
    app.state.className="appState download";
    app.detail.textContent="下載失敗，請重新下載";

  }else{

    app.state.textContent="下載中";
    app.state.className="appState downloading";
    app.detail.textContent="正在下載 "+percent+"%";

  }

};


/* 電視盒方向鍵操作 */
document.addEventListener("keydown",function(event){

  var cards=Array.prototype.slice.call(
    document.querySelectorAll(".app")
  );

  if(!cards.length)return;

  var current=cards.indexOf(document.activeElement);
  if(current<0)current=0;

  var next=current;

  if(event.key==="ArrowRight"){
    next=Math.min(current+1,cards.length-1);
  }else if(event.key==="ArrowLeft"){
    next=Math.max(current-1,0);
  }else if(event.key==="ArrowDown"){
    next=Math.min(current+3,cards.length-1);
  }else if(event.key==="ArrowUp"){
    next=Math.max(current-3,0);
  }else{
    return;
  }

  event.preventDefault();
  cards[next].focus();

});


loadApps();

</script>

</body>
</html>
