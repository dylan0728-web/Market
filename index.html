
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  color:#fff;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:linear-gradient(135deg,#101820,#202d38);
}

header{
  padding:22px 16px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
}

#appList{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  padding:12px;
}

.card{
  min-width:0;
  padding:14px 8px;
  border-radius:15px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.10);
  text-align:center;
  cursor:pointer;
  overflow:hidden;
}

.card:active{
  background:rgba(255,255,255,.16);
}

.appIcon{
  width:66px;
  height:66px;
  margin:0 auto 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:rgba(255,255,255,.12);
  overflow:hidden;
  font-size:23px;
  font-weight:bold;
}

.appIcon img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.appName{
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  line-height:1.4;
  word-break:break-word;
}

.progressArea{
  display:none;
  margin-top:10px;
}

.progressTrack{
  width:100%;
  height:5px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.20);
}

.progressFill{
  height:100%;
  width:0%;
  border-radius:10px;
  background:#35d07f;
  transition:width .25s;
}

.progressText{
  margin-top:5px;
  font-size:11px;
  color:#b9f5d1;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 10px;
  color:#bbb;
}

@media(max-width:360px){
  #appList{gap:8px;padding:8px}
  .card{padding:11px 5px}
  .appIcon{width:56px;height:56px}
  .appName{font-size:12px}
}
</style>
</head>

<body>

<header>APK 應用程式市場</header>

<div id="appList">
  <div class="empty">正在載入軟體清單...</div>
</div>

<script>
const list = document.getElementById("appList");

let appsConfig = [];
const appCards = new Map();

function getConfig(fileName){
  return appsConfig.find(app =>
    String(app.file || "").toLowerCase() === fileName.toLowerCase()
  ) || {};
}

function getChineseName(fileName){
  const item = getConfig(fileName);
  return item.name || fileName.replace(/\.apk$/i,"");
}

function createCard(fileName,url){
  const config = getConfig(fileName);

  const card = document.createElement("div");
  card.className = "card";

  const icon = document.createElement("div");
  icon.className = "appIcon";
  icon.textContent = "APK";

  if(config.icon){
    const img = document.createElement("img");
    img.alt = config.name || fileName;
    img.loading = "lazy";
    img.src = config.icon;
    img.onerror = () => {
      icon.textContent = "APK";
    };
    icon.replaceChildren(img);
  }

  const appName = document.createElement("div");
  appName.className = "appName";
  appName.textContent = getChineseName(fileName);

  const progressArea = document.createElement("div");
  progressArea.className = "progressArea";

  const track = document.createElement("div");
  track.className = "progressTrack";

  const bar = document.createElement("div");
  bar.className = "progressFill";
  track.appendChild(bar);

  const progressText = document.createElement("div");
  progressText.className = "progressText";

  progressArea.appendChild(track);
  progressArea.appendChild(progressText);

  card.appendChild(icon);
  card.appendChild(appName);
  card.appendChild(progressArea);

  card.addEventListener("click", () => {
    if(!window.AndroidMarket){
      alert("請使用皇奕科技 APK 市場開啟");
      return;
    }

    progressArea.style.display = "none";

    const packageName = config.packageName || "";

    if(packageName &&
       typeof AndroidMarket.checkInstalled === "function"){
      AndroidMarket.checkInstalled(packageName,url);
    }else if(typeof AndroidMarket.startDownload === "function"){
      AndroidMarket.startDownload(url,fileName);
    }else{
      alert("目前無法啟動下載，請重新開啟市場");
    }
  });

  list.appendChild(card);

  appCards.set(url,{
    fileName,
    card,
    icon,
    bar,
    text:progressText,
    progressArea,
    packageName:config.packageName || ""
  });
}

function loadApps(){
  fetch("./apps.json?time="+Date.now())
    .then(response => {
      if(!response.ok) throw new Error("apps.json 讀取失敗");
      return response.json();
    })
    .then(data => {
      appsConfig = Array.isArray(data.apps) ? data.apps : [];

      return fetch(
        "https://api.github.com/repos/dylan0728-web/Market/releases"
      );
    })
    .then(response => {
      if(!response.ok) throw new Error("GitHub 軟體清單讀取失敗");
      return response.json();
    })
    .then(releases => {
      list.replaceChildren();
      appCards.clear();

      const assets = [];

      releases.forEach(release => {
        (release.assets || []).forEach(asset => {
          if(asset.name.toLowerCase().endsWith(".apk")){
            assets.push(asset);
          }
        });
      });

      if(assets.length === 0){
        list.innerHTML =
          '<div class="empty">目前沒有可下載的 APK</div>';
        return;
      }

      assets.forEach(asset => {
        createCard(asset.name,asset.browser_download_url);
      });
    })
    .catch(error => {
      console.error(error);
      list.innerHTML =
        '<div class="empty">軟體清單載入失敗，請稍後再試</div>';
    });
}

window.onAppCheckResult = function(
  url,
  installed,
  appLabel,
  iconData,
  packageName
){
  const item = appCards.get(url);
  if(!item) return;

  item.packageName = packageName || item.packageName;

  if(iconData){
    const img = document.createElement("img");
    img.alt = appLabel || item.fileName;
    img.src = "data:image/png;base64," + iconData;
    item.icon.replaceChildren(img);
  }

  if(installed){
    const choice = confirm(
      (appLabel || item.fileName) +
      "\n\n此軟體已經安裝。\n\n按「確定」開啟軟體；按「取消」選擇卸載。"
    );

    if(choice){
      if(item.packageName){
        AndroidMarket.launchApp(item.packageName);
      }
    }else{
      if(item.packageName && confirm("確定要卸載／刪除此軟體嗎？")){
        AndroidMarket.uninstallApp(item.packageName);
      }
    }
  }else{
    AndroidMarket.startDownload(url,item.fileName);
  }
};

window.onApkIconResult = function(url,iconData){
  const item = appCards.get(url);
  if(!item || !iconData) return;

  const img = document.createElement("img");
  img.alt = item.fileName;
  img.src = "data:image/png;base64," + iconData;
  item.icon.replaceChildren(img);
};

window.onApkDownloadProgress = function(url,percent,state){
  const item = appCards.get(url);
  if(!item) return;

  if(state === "downloading"){
    item.progressArea.style.display = "block";
    item.bar.style.width =
      Math.max(0,Math.min(100,percent)) + "%";
    item.text.textContent = "下載中… " + percent + "%";
  }else{
    item.progressArea.style.display = "none";
    item.bar.style.width = "0%";
    item.text.textContent = "";
  }
};

loadApps();
</script>

</body>
</html>
