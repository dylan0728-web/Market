
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  color:#fff;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:linear-gradient(135deg,#101820,#202d38);
}

header{
  padding:22px 16px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
}

#appList{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  padding:12px;
}

.card{
  min-width:0;
  padding:14px 8px;
  border-radius:15px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.10);
  text-align:center;
  cursor:pointer;
  overflow:hidden;
}

.card:active{
  background:rgba(255,255,255,.16);
}

.appIcon{
  width:66px;
  height:66px;
  margin:0 auto 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:rgba(255,255,255,.12);
  overflow:hidden;
  font-size:23px;
  font-weight:bold;
}

.appIcon img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.appName{
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  line-height:1.4;
  word-break:break-word;
}

.progressArea{
  margin-top:10px;
  min-height:29px;
}

.progressTrack{
  width:100%;
  height:5px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.20);
}

.progressFill{
  height:100%;
  width:0%;
  border-radius:10px;
  background:#35d07f;
  transition:width .25s;
}

.progressText{
  margin-top:5px;
  font-size:11px;
  color:#b9f5d1;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 10px;
  color:#bbb;
}

@media(max-width:360px){
  #appList{gap:8px;padding:8px}
  .card{padding:11px 5px}
  .appIcon{width:56px;height:56px}
  .appName{font-size:12px}
}
</style>
</head>

<body>

<header>APK 應用程式市場</header>

<div id="appList">
  <div class="empty">正在載入軟體清單...</div>
</div>

<script>
const list = document.getElementById("appList");

let appsConfig = [];
let appCards = new Map();

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function getChineseName(fileName){
  const item = appsConfig.find(app =>
    String(app.file || "").toLowerCase() === fileName.toLowerCase()
  );

  return item ? item.name : fileName.replace(/\.apk$/i,"");
}

function createCard(fileName,url){
  const name = getChineseName(fileName);

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="appIcon" id="icon-${CSS.escape(fileName)}">APK</div>
    <div class="appName">${escapeHtml(name)}</div>
    <div class="progressArea">
      <div class="progressTrack">
        <div class="progressFill" id="bar-${CSS.escape(fileName)}"></div>
      </div>
      <div class="progressText" id="text-${CSS.escape(fileName)}"></div>
    </div>
  `;

  card.addEventListener("click", () => {
    if(!window.AndroidMarket){
      alert("請使用皇奕科技 APK 市場開啟");
      return;
    }

    const packageName = card.dataset.package || "";

    if(typeof AndroidMarket.checkInstalled === "function"){
      AndroidMarket.checkInstalled(packageName,url);
    }else{
      AndroidMarket.startDownload(url,fileName);
    }
  });

  list.appendChild(card);

  appCards.set(url,{
    fileName,
    card,
    icon:card.querySelector(".appIcon"),
    bar:card.querySelector(".progressFill"),
    text:card.querySelector(".progressText")
  });

  if(window.AndroidMarket &&
     typeof AndroidMarket.loadApkIcon === "function"){
    AndroidMarket.loadApkIcon(url,fileName);
  }
}

function loadApps(){
  fetch("./apps.json?time="+Date.now())
    .then(response => {
      if(!response.ok) throw new Error("apps.json 讀取失敗");
      return response.json();
    })
    .then(data => {
      appsConfig = Array.isArray(data.apps) ? data.apps : [];
      return fetch(
        "https://api.github.com/repos/dylan0728-web/Market/releases"
      );
    })
    .then(response => {
      if(!response.ok) throw new Error("GitHub 軟體清單讀取失敗");
      return response.json();
    })
    .then(releases => {
      list.replaceChildren();
      appCards.clear();

      const assets = [];

      releases.forEach(release => {
        (release.assets || []).forEach(asset => {
          if(asset.name.toLowerCase().endsWith(".apk")){
            assets.push(asset);
          }
        });
      });

      if(assets.length === 0){
        list.innerHTML =
          '<div class="empty">目前沒有可下載的 APK</div>';
        return;
      }

      assets.forEach(asset => {
        createCard(asset.name,asset.browser_download_url);
      });
    })
    .catch(error => {
      console.error(error);
      list.innerHTML =
        '<div class="empty">軟體清單載入失敗，請稍後再試</div>';
    });
}

window.onApkIconResult = function(url,iconData){
  const item = appCards.get(url);
  if(!item || !iconData) return;

  const img = document.createElement("img");
  img.alt = item.fileName;
  img.src = "data:image/png;base64," + iconData;

  item.icon.replaceChildren(img);
};

window.onAppCheckResult = function(url,installed,appLabel,iconData){
  const item = appCards.get(url);
  if(!item) return;

  if(iconData){
    const img = document.createElement("img");
    img.alt = appLabel || item.fileName;
    img.src = "data:image/png;base64," + iconData;
    item.icon.replaceChildren(img);
  }

  if(installed){
    const packageName = item.card.dataset.package || "";

    const choice = confirm(
      (appLabel || item.fileName) +
      "\n\n此軟體已經安裝。\n\n按「確定」開啟軟體；按「取消」選擇卸載。"
    );

    if(choice){
      if(packageName) AndroidMarket.launchApp(packageName);
    }else{
      if(packageName && confirm("確定要卸載／刪除此軟體嗎？")){
        AndroidMarket.uninstallApp(packageName);
      }
    }
  }else{
    AndroidMarket.startDownload(url,item.fileName);
  }
};

window.onApkDownloadProgress = function(url,percent,state){
  const item = appCards.get(url);
  if(!item) return;

  item.bar.style.width = Math.max(0,Math.min(100,percent)) + "%";

  if(state === "downloading"){
    item.text.textContent = "下載中… " + percent + "%";
  }else if(state === "complete"){
    item.text.textContent = "下載完成";
  }else if(state === "failed"){
    item.text.textContent = "下載失敗";
  }
};

loadApps();
</script>

</body>
</html>
