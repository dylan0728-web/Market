
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePath = System.getenv("HY_KEYSTORE_PATH")

android {
    namespace 'tw.com.huangyi.apkmarket'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.com.huangyi.apkmarket'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '0.3-auto-update'
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("HY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HY_KEY_ALIAS")
                keyPassword System.getenv("HY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.15.0'
}
