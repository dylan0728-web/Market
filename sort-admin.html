<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HY 市場排序管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;color:#fff;font-family:Arial,"Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#101827,#303b4d);min-height:100vh}
main{max-width:900px;margin:0 auto}
h1{margin:0 0 8px;font-size:28px}
.note{color:#c5d0df;line-height:1.7}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
button{background:#315b8c;color:white;border:1px solid #7596bd;border-radius:9px;padding:11px 16px;font-size:15px;cursor:pointer}
button.secondary{background:#344256}
button:disabled{opacity:.45;cursor:not-allowed}
#status{padding:12px;border-radius:9px;background:#ffffff12;color:#dce8f8;margin:14px 0}
#list{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:#ffffff12;border:1px solid #ffffff25;border-radius:10px;min-height:58px}
.item.dragging{opacity:.45}
.item.over{border:2px dashed #8fc5ff}
.handle{font-size:22px;color:#b7c8dc;cursor:grab}
.num{width:32px;color:#9fb4ce;text-align:right;font-variant-numeric:tabular-nums}
.name{flex:1;overflow-wrap:anywhere;font-weight:bold}
.filename{display:block;color:#aebed2;font-size:12px;font-weight:normal;margin-top:3px}
.moves{display:flex;gap:5px}
.moves button{padding:6px 10px;min-width:38px}
footer{margin-top:20px;color:#aebed2;font-size:13px;line-height:1.7}
@media(max-width:560px){body{padding:14px}.item{gap:7px;padding:9px}.moves button{padding:6px 8px}.num{width:24px}}
</style>
</head>
<body>
<main>
<h1>HY 市場排序管理</h1>
<div class="note">拖曳 APP 卡片，或使用右側上下箭頭調整順序。完成後按「下載排序檔」，再將 sort.json 上傳到 GitHub 專案 main 分支根目錄。所有電視盒就會讀取同一份排序。</div>
<div class="toolbar">
<button id="reload">重新讀取 APP</button>
<button id="download" disabled>下載排序檔 sort.json</button>
</div>
<div id="status">正在讀取 GitHub Releases……</div>
<ol id="list"></ol>
<footer>
注意：本頁只負責產生排序檔，不會直接修改 GitHub。只有具備 Market Repository 寫入權限的帳號才能更新雲端排序，因此不需要把 GitHub 金鑰放在公開網頁。
</footer>
</main>
<script>
(function(){
"use strict";
const API="https://api.github.com/repos/dylan0728-web/Market/releases";
const SORT_URL="https://dylan0728-web.github.io/Market/sort.json";
const list=document.getElementById("list");
const status=document.getElementById("status");
const downloadButton=document.getElementById("download");
const nameMap={
"H_S.apk":"紅果TV","G_SSS.apk":"今日影視","K_SSS.apk":"可可影视","W_SSS.apk":"网飞猫",
"I_SSS.apk":"愛壹帆","D_SSS.apk":"獨播庫","KB_SSS.apk":"酷播",
"AppDrawer.apk":"App Drawer_6_選單","SmartTube.apk":"SmartTube","Orz.apk":"Orz",
"AirScreen_2.3.1.apk":"AirScreen","APKPure_3.17.58.apk":"APKPure",
"IQQIKeyboard_2.2.7942.0.apk":"IQQI Keyboard","LetsView_1.5.20.apk":"LetsView",
"ES.apk":"ES檔案瀏覽器","Google.apk":"Google Play Store"
};
const specialOrder=["H_S.apk","G_SSS.apk","K_SSS.apk","W_SSS.apk","I_SSS.apk","D_SSS.apk","KB_SSS.apk"];
let files=[];
let dragged=null;
function label(file){return nameMap[file]||file.replace(/\.apk$/i,"").replace(/[_-]\d[\w.-]*$/,"")}
function isUpdate(name){
const n=String(name||"").toLowerCase();
return ["hy.apk","hyupdate.apk","hy_update.apk","hy應用市場.apk","hy應用市場更新.apk"].includes(n)||/^hyupdate[-_].*\.apk$/i.test(n)||/^hy應用市場[-_].*\.apk$/i.test(n);
}
function move(from,to){if(from===to||from<0||to<0||from>=files.length||to>=files.length)return;const x=files.splice(from,1)[0];files.splice(to,0,x);render()}
function render(){
list.innerHTML="";
files.forEach((file,index)=>{
const li=document.createElement("li");li.className="item";li.draggable=true;li.dataset.index=String(index);
const handle=document.createElement("span");handle.className="handle";handle.textContent="☷";handle.title="拖曳調整";
const num=document.createElement("span");num.className="num";num.textContent=String(index+1)+".";
const name=document.createElement("span");name.className="name";name.textContent=label(file);
const fn=document.createElement("span");fn.className="filename";fn.textContent=file;name.appendChild(fn);
const moves=document.createElement("span");moves.className="moves";
const up=document.createElement("button");up.className="secondary";up.type="button";up.textContent="↑";up.title="往上";up.disabled=index===0;up.onclick=()=>move(index,index-1);
const down=document.createElement("button");down.className="secondary";down.type="button";down.textContent="↓";down.title="往下";down.disabled=index===files.length-1;down.onclick=()=>move(index,index+1);
moves.append(up,down);li.append(handle,num,name,moves);
li.addEventListener("dragstart",e=>{dragged=index;li.classList.add("dragging");e.dataTransfer.effectAllowed="move"});
li.addEventListener("dragend",()=>{dragged=null;li.classList.remove("dragging");list.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))});
li.addEventListener("dragover",e=>{e.preventDefault();li.classList.add("over")});
li.addEventListener("dragleave",()=>li.classList.remove("over"));
li.addEventListener("drop",e=>{e.preventDefault();li.classList.remove("over");if(dragged!==null)move(dragged,index)});
list.appendChild(li);
});
downloadButton.disabled=files.length===0;
}
async function load(){
downloadButton.disabled=true;status.textContent="正在讀取 GitHub Releases……";list.innerHTML="";
try{
const r=await fetch(API,{headers:{"Accept":"application/vnd.github+json"},cache:"no-store"});
if(!r.ok)throw new Error("GitHub Releases HTTP "+r.status);
const releases=await r.json();if(!Array.isArray(releases))throw new Error("GitHub 回傳格式錯誤");
const all=[];const seen=new Set();
releases.forEach(rel=>{if(!rel||rel.draft||rel.prerelease)return;(rel.assets||[]).forEach(a=>{
if(!a||!a.name||!/\.apk$/i.test(a.name)||isUpdate(a.name)||seen.has(a.name))return;
seen.add(a.name);all.push(a.name);
})});
if(!all.length)throw new Error("沒有找到 APK");
let order=[];
try{const sr=await fetch(SORT_URL,{cache:"no-store"});if(sr.ok){const data=await sr.json();if(Array.isArray(data.files))order=data.files.filter(x=>typeof x==="string")}}catch(e){}
if(order.length===0){
const set=new Set(specialOrder.filter(x=>all.includes(x)));
const first=all.findIndex(x=>set.has(x));
const rest=all.filter(x=>!set.has(x));
order=first<0?all.slice():rest.slice(0,first).concat(specialOrder.filter(x=>set.has(x)),rest.slice(first));
}
const valid=new Set(all);
files=order.filter((x,i)=>valid.has(x)&&order.indexOf(x)===i);
all.forEach(x=>{if(!files.includes(x))files.push(x)});
render();status.textContent="已載入 "+files.length+" 個 APP。調整順序後，按「下載排序檔 sort.json」。";
}catch(e){status.textContent="讀取失敗："+e.message+"。請確認網路連線後按重新讀取。"}
}
downloadButton.addEventListener("click",()=>{
const payload={version:1,updatedAt:new Date().toISOString(),files:files.slice()};
const blob=new Blob([JSON.stringify(payload,null,2)+"\n"],{type:"application/json;charset=utf-8"});
const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="sort.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
status.textContent="已產生 sort.json。請將它上傳到 GitHub Market 專案 main 分支根目錄，取代舊的 sort.json。";
});
document.getElementById("reload").addEventListener("click",load);
load();
})();
</script>
</body>
</html>
