
name: Update APK Versions

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Locate Android APK Analyzer
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer -print -quit)"

          if [ -z "$APKANALYZER" ]; then
            echo "::error::找不到 Android apkanalyzer"
            exit 1
          fi

          echo "$(dirname "$APKANALYZER")" >> "$GITHUB_PATH"
          echo "找到 APK Analyzer：$APKANALYZER"

      - name: Read APK versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_versions.py

      - name: Commit and push versions.json
        run: |
          if git diff --quiet -- versions.json; then
            echo "versions.json 沒有變更"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions.json
            git commit -m "Auto update APK versions"
            git push origin HEAD:main
          fi
