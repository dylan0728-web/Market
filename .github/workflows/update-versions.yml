name: Update APK Versions

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android command line tools
        run: |
          sdkmanager --install "cmdline-tools;latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Read APK versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_versions.py

      - name: Commit and push versions.json
        run: |
          if git diff --quiet -- versions.json; then
            echo "versions.json 沒有變更"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions.json
            git commit -m "Auto update APK versions"
            git push origin HEAD:main
          fi