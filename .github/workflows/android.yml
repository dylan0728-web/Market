
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HY_KEYSTORE_BASE64: ${{ secrets.HY_KEYSTORE_BASE64 }}
      HY_KEYSTORE_PATH: ${{ github.workspace }}/app/hy-market.jks
      HY_KEYSTORE_PASSWORD: ${{ secrets.HY_KEYSTORE_PASSWORD }}
      HY_KEY_ALIAS: ${{ secrets.HY_KEY_ALIAS }}
      HY_KEY_PASSWORD: ${{ secrets.HY_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        run: |
          printf '%s' "$HY_KEYSTORE_BASE64" | base64 --decode > "$HY_KEYSTORE_PATH"
          test -s "$HY_KEYSTORE_PATH"

      - name: Build signed APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HY應用市場.apk
          cp app/build/outputs/apk/debug/app-debug.apk HY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HY應用市場
          path: HY應用市場.apk
          if-no-files-found: error

      - name: Prepare market release notes
        run: |
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          DATE=$(TZ=Asia/Taipei date +'%Y/%m/%d')

          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"

          printf 'versionCode=%s\nversionName=%s\ndate=%s\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$DATE" > release-notes.txt

          cat release-notes.txt

      - name: Publish market update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: market-update
          name: HY應用市場更新
          body_path: release-notes.txt
          files: HY.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release information directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(gh api repos/dylan0728-web/Market/releases/tags/market-update --jq .id)
          test -n "$RELEASE_ID"

          gh api "repos/dylan0728-web/Market/releases/$RELEASE_ID" \
            --method PATCH \
            -F body="$(cat release-notes.txt)"

          echo "Release information updated."
