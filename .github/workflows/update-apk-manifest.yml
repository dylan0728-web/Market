name: Update APK manifest

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-apk-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate apps.json from GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -s --arg generated "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" '
                add
                | [
                    .[]
                    | select(.draft == false and .prerelease == false)
                    | . as $release
                    | (.assets // [])[]
                    | select((.name | ascii_downcase | endswith(".apk")))
                    | select(.browser_download_url | type == "string")
                    | {
                        name: .name,
                        size: (.size // 0),
                        browser_download_url: .browser_download_url,
                        version: ($release.tag_name // $release.name // "未標示版本"),
                        release_tag: ($release.tag_name // ""),
                        release_name: ($release.name // "")
                      }
                  ] as $apps
                | {
                    generated_at: $generated,
                    apps: $apps
                  }
              ' > apps.json

          echo "Generated APK entries:"
          jq '.apps | length' apps.json

      - name: Commit updated manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "apps.json is already up to date."
          else
            git commit -m "Update APK manifest"
            git push
          fi
